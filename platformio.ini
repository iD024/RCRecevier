[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-missing-field-initializers
    -Wno-unused-parameter
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -Iinclude
    -Isrc

monitor_speed = 115200

upload_protocol = stlink
debug_tool = stlink

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Itest/stubs
    -Isrc
    -Iinclude
build_src_filter =
    +<protocol/CRC16.cpp>
    +<protocol/PacketDecoder.cpp>
    +<channel/ChannelProcessor.cpp>